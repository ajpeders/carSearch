services:
  carsearch:
    build: .
    image: carsearch:latest
    container_name: carsearch
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Override any CARSEARCH_* var here, or use an env_file.
      CARSEARCH_ENABLE_DEMO: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist the watchlist / favorites across container recreation.
      - carsearch-data:/data

volumes:
  carsearch-data:
